name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: # GitHub ওয়েবসাইট থেকে বাটনে ক্লিক করে ম্যানুয়ালি বিল্ড রান করার সুবিধা

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Release Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "rojob_windows_release.zip"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rojob-Windows-Release
          path: rojob_windows_release.zip
          retention-days: 14

